name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      # prebuild geocoding skips itself when MAPBOX_SECRET_TOKEN is unset.
      # The Playwright suite targets the deployed site, so it is not run here.
      - run: npm run build
